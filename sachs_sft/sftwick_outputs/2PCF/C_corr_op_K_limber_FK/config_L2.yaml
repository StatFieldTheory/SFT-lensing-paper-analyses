# Paths are relative to this folder since 2026-09-02: sft-wick resolves module and data
# paths against the YAML directory, and scripts/run_FF_single.py changes into it before
# running, so output and cache paths resolve here too. Values are otherwise unchanged
# from the 2026-06 production run (absolute paths of that machine before this date).
system:
  field:
    name: phi
    n_components: 3
  linear:
    type: explicit
    R_time_module: ../../../scripts/D_callable.py
    R_time_attr: response_R
    iso_R: true
  noise:
    kappa2:
      type: callable_module
      module: ../../../scripts/kappa2_callable.py
      attr: kappa2
  vertices:
  - name: F
    coupling_path: ../../../scripts/inputs/F_tensor.npy
  nonlocal_vertices:
  - name: K
    order: 3
    coupling_module: ../../../callables/kappa3_vertex/equal_time_limber/equal_time_limber_kappa3_callable.py
    coupling_attr: coupling_fn_batch
    coupling_vectorized: true
    equal_time: true
expand:
  observable:
  - "phi_a(x)"
  - "phi_b(y)"
  orders: [0, 2]
  response_phase: true
  ito: true
  collect_topology: true
  diag_R: true
  diag_C: false
  cache_path: .cache_expand_C_corr_op_K_limber_FK
  n_jobs: 1
propagators:
  t_max: 2360.0
  dt: 1.0
  homogeneity: rotation
  n_grid_cos: 32
  n_jobs: -1
  cache_path: .cache_propagators_C_corr_op_K_limber_FK
  c_closed_form_module: ../../../callables/C_propagator/corr_op/corr_op_C_callable.py
  c_closed_form_attr: C_fn_batch
  c_closed_form_only: true
  c_closed_form_vectorized: true
  c_method: gauss_legendre
  c_n_gauss: 20
  diag_C: false
sweep:
  vertex_types:
    - FK
  integrate_over: "all"

  # 40 log-spaced gamma points from 0.5 to 5000 arcmin
  positions_grid:
    x:
      - [0.0, 0.0, 1.0]
    y:
      - [0.0001454441, 0.0, 0.9999999894]    # gamma = 0.5000 arcmin
      - [0.0001841875, 0.0, 0.9999999830]    # gamma = 0.6332 arcmin
      - [0.0002332514, 0.0, 0.9999999728]    # gamma = 0.8019 arcmin
