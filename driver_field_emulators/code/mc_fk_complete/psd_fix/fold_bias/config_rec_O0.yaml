  dt: 1.0
  homogeneity: rotation
  n_grid_cos: 32
  n_jobs: 1
  cache_path: /Users/zzhang/Documents/MyDrafts/STF_lensing/driver_field_emulators/code/mc_fk_complete/psd_fix/fold_bias/rec_O0/.cache_propagators_C_corr_op_O0
  c_closed_form_module: /Users/zzhang/Documents/MyDrafts/STF_lensing/driver_field_emulators/code/mc_fk_complete/psd_fix/fold_bias/recording_C_callable.py
