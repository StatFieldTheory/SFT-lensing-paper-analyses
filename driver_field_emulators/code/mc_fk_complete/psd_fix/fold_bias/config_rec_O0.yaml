  c_closed_form_only: true
  c_closed_form_vectorized: false
  c_method: gauss_legendre
  c_n_gauss: 20
  diag_C: false


sweep:
  integrate_over: "all"

  # 40 log-spaced gamma points from 0.5 to 5000 arcmin
  positions_grid:
    x:
      - [0.0, 0.0, 1.0]
    y:
      - [0.0001454441, 0.0, 0.9999999894]    # gamma = 0.5000 arcmin
      - [0.0050252287, 0.0, 0.9999873735]    # gamma = 17.2755 arcmin
      - [0.0853881735, 0.0, 0.9963477605]    # gamma = 293.9008 arcmin

  t_final_grid:
  - 2313.0288751857356
  
  component_pairs:
    - [0, 0]   # kappa-kappa
    - [0, 1]   # kappa-gamma_+
    - [0, 2]   # kappa-gamma_x
    - [1, 1]   # gamma_+-gamma_+
    - [1, 2]   # gamma_+-gamma_x
    - [2, 2]   # gamma_x-gamma_x

  method: gauss_legendre
  n_gauss: 24
  n_jobs: 1
output:
- type: npz
